{% extends "base.html" %}
{% block title %}Forgot Password - Brainwave Academy{% endblock %}
{% block content %}
<div class="card bw-card login-card">
  <div class="card-body p-4">
    <img src="{{ url_for('public.logo') }}" alt="Brainwave Academy" class="login-logo">
    <h5 class="text-center text-bw-teal mb-2">Forgot password</h5>
    <p class="text-muted small text-center mb-4">
      Enter your username and the academy office will set a new password for you.
      They will tell you the new password directly.
    </p>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control form-control-lg" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label">Your name or a note <span class="text-muted">(optional)</span></label>
        <input type="text" name="note" class="form-control" maxlength="255"
               placeholder="So the office knows who is asking">
      </div>
      <button type="submit" class="btn btn-bw-primary btn-lg w-100">Send request</button>
    </form>
    <div class="text-center mt-3">
      <a href="{{ url_for('auth.login') }}" class="text-bw-teal">Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
