{% extends "learn/learn_base.html" %}
{% block title %}Sign in - {{ app_name }}{% endblock %}
{% block content %}
<div class="card bw-card login-card">
  <div class="card-body p-4">
    <h5 class="text-center text-bw-teal mb-3">Sign in</h5>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Mobile number</label>
        <input type="tel" name="mobile" class="form-control form-control-lg" inputmode="numeric" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control form-control-lg" required>
      </div>
      <button class="btn btn-bw-primary btn-lg w-100">Sign in</button>
    </form>
    <p class="text-center small mt-3 mb-0">
      New here? <a href="{{ url_for('learn.register') }}" class="text-bw-teal">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
