{% extends "learn/learn_base.html" %}
{% block title %}Register - {{ app_name }}{% endblock %}
{% block content %}
<div class="card bw-card login-card">
  <div class="card-body p-4">
    <h5 class="text-center text-bw-teal mb-3">Create your account</h5>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Your name</label>
        <input type="text" name="name" class="form-control form-control-lg" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Mobile number</label>
        <input type="tel" name="mobile" class="form-control form-control-lg" inputmode="numeric" required>
        <div class="form-text">You will sign in with this number.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Email <span class="text-muted">(optional)</span></label>
        <input type="email" name="email" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control form-control-lg" minlength="6" required>
        <div class="form-text">At least 6 characters.</div>
      </div>
      <button class="btn btn-bw-primary btn-lg w-100">Create account</button>
    </form>
    <p class="text-center small mt-3 mb-0">
      Already registered? <a href="{{ url_for('learn.login') }}" class="text-bw-teal">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
