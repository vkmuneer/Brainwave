{% extends "base.html" %}
{% block title %}Login - Brainwave Academy{% endblock %}
{% block content %}
<div class="card bw-card login-card">
  <div class="card-body p-4">
    <img src="{{ url_for('public.logo') }}" alt="Brainwave Academy" class="login-logo">
    <h5 class="text-center text-bw-teal mb-3">Sign in</h5>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control form-control-lg" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control form-control-lg" required>
      </div>
      <button type="submit" class="btn btn-bw-primary btn-lg w-100">Login</button>
    </form>
    <div class="text-center mt-3">
      <a href="{{ url_for('auth.forgot_password') }}" class="text-bw-teal">Forgot password?</a>
    </div>
  </div>
</div>
{% endblock %}
